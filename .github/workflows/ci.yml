name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
      - name: Cargo test
        run: cargo test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: h3llo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Verify image
        run: docker image inspect h3llo:test

  docker-integration:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: h3llo:test
          cache-from: type=gha
          load: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Docker integration tests
        run: cargo test --test docker_integration -- --ignored --nocapture
