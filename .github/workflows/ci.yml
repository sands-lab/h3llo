name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: nekonuts/h3llo
  # Manual invalidation key for the downloaded musl-cross bundle and all musl
  # build caches. Bump this when the pinned toolchain bundle changes.
  MUSL_CROSS_VERSION: "20250929"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/native
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy
      # Keep lint/coverage artifacts separate from integration-test artifacts.
      # Clippy --all-targets --all-features and llvm-cov select different Cargo
      # units, features, dev-dependencies, and instrumentation than docker-tests.
      # Reusing this cache there produced an exact key hit but still rebuilt
      # almost the entire dependency graph.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: native
          workspaces: ". -> target/native"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Generate coverage
        run: cargo llvm-cov --lib --codecov --output-path codecov.json
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # These native release builds deliberately do not use actions/cache or
  # rust-cache: every run builds its platform artifact from a clean runner.
  windows-release:
    name: Build Windows x64 release binary
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/release/windows-x64
      # Select the static MSVC CRT (/MT) for Rust code. The CMake toolchain
      # below applies the same choice to BoringSSL and other native code.
      RUSTFLAGS: "-C target-feature=+crt-static"
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/.github/cmake/windows-static-crt.cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin h3llo

      - name: Verify static C runtime
        shell: pwsh
        run: |
          $binary = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\h3llo.exe"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }
          $dependencies = & $dumpbin /DEPENDENTS $binary
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $dependencies
          if ($dependencies -match '(?im)^\s*(?:api-ms-win-crt-[\w-]+|ucrtbase|vcruntime\d*|msvcp\d*|msvcr\d*)\.dll\s*$') {
            throw "Windows release binary depends on a Visual C runtime DLL"
          }

      - name: Package release asset
        shell: pwsh
        run: |
          $binary = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\h3llo.exe"
          $releaseDir = Join-Path $env:RUNNER_TEMP "release"
          $asset = Join-Path $releaseDir "h3llo-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Compress-Archive -Path $binary -DestinationPath $asset

      # This artifact transfers the packaged output to the release job; it is
      # not a dependency or build cache.
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-windows-x64
          path: ${{ runner.temp }}/release/h3llo-windows-x64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-release:
    name: Build macOS ARM64 release binary
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/release/macos-arm64
      # Apple Silicon requires macOS 11 or later. macOS cannot produce a fully
      # static system executable, so the CI verifies it has no bundled dylibs.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --locked --release --target aarch64-apple-darwin --bin h3llo

      - name: Verify native architecture and linkage
        run: |
          binary="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/h3llo"
          file "$binary" | grep -q "arm64"
          dependencies="$(otool -L "$binary" | tail -n +2)"
          printf '%s\n' "$dependencies"
          if printf '%s\n' "$dependencies" | grep -Eq '^[[:space:]]*(@rpath|@loader_path|/usr/local|/opt/homebrew)'; then
            echo "::error::macOS release binary has a non-system dynamic dependency"
            exit 1
          fi

      - name: Package release asset
        run: |
          binary="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/h3llo"
          release_dir="$RUNNER_TEMP/release"
          package_dir="$release_dir/h3llo-macos-arm64"
          mkdir -p "$package_dir"
          cp "$binary" "$package_dir/h3llo"
          tar -C "$release_dir" -czf "$release_dir/h3llo-macos-arm64.tar.gz" h3llo-macos-arm64

      # This artifact transfers the packaged output to the release job; it is
      # not a dependency or build cache.
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-macos-arm64
          path: ${{ runner.temp }}/release/h3llo-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  docker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make perl golang-go git clang libclang-dev xz-utils jq

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Restore musl-cross toolchain
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/musl-cross
          key: musl-cross-${{ env.MUSL_CROSS_VERSION }}-amd64

      # rust-cache includes RUSTFLAGS in its environment hash. Keep the static
      # CRT flag identical here and in the build step or the key will diverge.
      - name: Restore musl build cache
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        with:
          cache-bin: false
          prefix-key: v0-rust-musl-${{ env.MUSL_CROSS_VERSION }}
          shared-key: musl-amd64
          workspaces: ". -> target/musl/amd64"
          save-if: false

      - name: Build musl test binaries
        env:
          CARGO_TARGET_DIR: target/musl/amd64
          MUSL_CROSS_ROOT: ${{ runner.temp }}/musl-cross
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: scripts/build-musl.sh amd64 "${{ runner.temp }}/binary-out"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The Dockerfile only packages binaries built on the runner above. Cargo
      # caching therefore stays independent of BuildKit layers and exporters.
      - name: Build Docker test image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: binaries=${{ runner.temp }}/binary-out
          push: false
          tags: h3llo:test
          target: test
          platforms: linux/amd64
          load: true

      # This cache must match the Cargo consumers below. rust-cache hashes CARGO_*
      # and RUST* variables along with manifests, lockfiles, toolchain files, and
      # .cargo/config.toml. Omitting CARGO_TARGET_DIR here previously created a
      # different key; sharing the linux cache then hit the key but still missed
      # usable artifacts because its feature/profile/instrumentation set differed.
      #
      # Only master writes: PRs can read their base branch cache, while PR-written
      # caches are scoped to refs/pull/.../merge and cannot serve master or sibling
      # PRs. Source-only changes still reuse dependencies because rust-cache removes
      # workspace crate outputs before saving, so only h3llo is rebuilt.
      # See https://github.com/Swatinem/rust-cache#cache-details and
      # https://docs.github.com/actions/reference/workflows-and-actions/dependency-caching
      - name: Cache native test dependencies
        uses: Swatinem/rust-cache@v2
        env:
          CARGO_TARGET_DIR: target/native
        with:
          cache-bin: false
          shared-key: native-tests
          workspaces: ". -> target/native"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run integration tests
        env:
          CARGO_TARGET_DIR: target/native
        run: cargo test --test integration --features test-utils -- --ignored --nocapture

      - name: Run E2E tests
        env:
          CARGO_TARGET_DIR: target/native
        run: cargo test --test e2e -- --ignored --nocapture

  # Build multi-arch Docker images in parallel with lint and test jobs.
  # Runs on PRs too (for cross-compilation validation) but skips push.
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Job-level on purpose: both rust-cache and build-musl.sh must observe the
    # same hashed compiler flags.
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_label: amd64
            rust_target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            arch_label: arm64
            rust_target: aarch64-unknown-linux-musl
          - platform: linux/riscv64
            arch_label: riscv64
            rust_target: riscv64gc-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make perl golang-go git clang libclang-dev xz-utils jq

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore musl-cross toolchain
        id: musl-cross-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/musl-cross
          key: musl-cross-${{ env.MUSL_CROSS_VERSION }}-${{ matrix.arch_label }}

      # Cargo target artifacts are not portable across target triples. Keep the
      # shared key and target directory architecture-specific.
      - name: Cache musl build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v0-rust-musl-${{ env.MUSL_CROSS_VERSION }}
          shared-key: musl-${{ matrix.arch_label }}
          workspaces: ". -> target/musl/${{ matrix.arch_label }}"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build musl binaries
        env:
          CARGO_TARGET_DIR: target/musl/${{ matrix.arch_label }}
          MUSL_CROSS_ROOT: ${{ runner.temp }}/musl-cross
        run: scripts/build-musl.sh "${{ matrix.arch_label }}" "${{ runner.temp }}/binary-out"

      - name: Save musl-cross toolchain
        if: github.ref == 'refs/heads/master' && steps.musl-cross-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/musl-cross
          key: musl-cross-${{ env.MUSL_CROSS_VERSION }}-${{ matrix.arch_label }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Packaging only: the named binaries context is runner-built, so QEMU is
      # used for image assembly rather than slow cross-architecture compilation.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: binaries=${{ runner.temp }}/binary-out
          platforms: ${{ matrix.platform }}
          target: runtime
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Prepare binary artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/release"
          cp "${{ runner.temp }}/binary-out/h3llo" \
             "${{ runner.temp }}/release/h3llo-linux-${{ matrix.arch_label }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: binary-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/release/h3llo-linux-${{ matrix.arch_label }}
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch digests into a single multi-arch manifest list on Docker Hub.
  # Gates behind ALL jobs: builds must succeed AND tests must pass.
  docker-merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker-build, linux, docker-tests]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Create a GitHub release when a version tag is pushed or master is updated.
  # Gates behind the Docker release pipeline and the native release builds.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker-merge, windows-release, macos-release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/binaries
          pattern: binary-*
          merge-multiple: true

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/binaries/h3llo-*

      - name: Publish dev release
        if: github.ref == 'refs/heads/master'
        run: |
          ls ${{ runner.temp }}/binaries/h3llo-* || { echo "::error::No binary artifacts found"; exit 1; }
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            ${{ runner.temp }}/binaries/h3llo-* \
            --prerelease \
            --title "Development Build ($(date -u +%Y-%m-%d))" \
            --generate-notes \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
