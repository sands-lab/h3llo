name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: nekonuts/h3llo
  MUSL_CROSS_VERSION: "20250929"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/native
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: native
          workspaces: ". -> target/native"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Generate coverage
        run: cargo llvm-cov --lib --codecov --output-path codecov.json
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make perl golang-go git clang libclang-dev xz-utils jq

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Restore musl-cross toolchain
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/musl-cross
          key: musl-cross-${{ env.MUSL_CROSS_VERSION }}-amd64

      - name: Restore musl build cache
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        with:
          cache-bin: false
          prefix-key: v0-rust-musl-${{ env.MUSL_CROSS_VERSION }}
          shared-key: musl-amd64
          workspaces: ". -> target/musl/amd64"
          save-if: false

      - name: Build musl test binaries
        env:
          CARGO_TARGET_DIR: target/musl/amd64
          MUSL_CROSS_ROOT: ${{ runner.temp }}/musl-cross
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: scripts/build-musl.sh amd64 "${{ runner.temp }}/binary-out"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker test image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: binaries=${{ runner.temp }}/binary-out
          push: false
          tags: h3llo:test
          target: test
          platforms: linux/amd64
          load: true

      - name: Restore native test cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: native
          workspaces: ". -> target/native"
          save-if: false

      - name: Run integration tests
        env:
          CARGO_TARGET_DIR: target/native
        run: cargo test --test integration --features test-utils -- --ignored --nocapture

      - name: Run E2E tests
        env:
          CARGO_TARGET_DIR: target/native
        run: cargo test --test e2e -- --ignored --nocapture

  # Build multi-arch Docker images in parallel with lint and test jobs.
  # Runs on PRs too (for cross-compilation validation) but skips push.
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_label: amd64
            rust_target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            arch_label: arm64
            rust_target: aarch64-unknown-linux-musl
          - platform: linux/riscv64
            arch_label: riscv64
            rust_target: riscv64gc-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make perl golang-go git clang libclang-dev xz-utils jq

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore musl-cross toolchain
        id: musl-cross-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/musl-cross
          key: musl-cross-${{ env.MUSL_CROSS_VERSION }}-${{ matrix.arch_label }}

      - name: Cache musl build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v0-rust-musl-${{ env.MUSL_CROSS_VERSION }}
          shared-key: musl-${{ matrix.arch_label }}
          workspaces: ". -> target/musl/${{ matrix.arch_label }}"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build musl binaries
        env:
          CARGO_TARGET_DIR: target/musl/${{ matrix.arch_label }}
          MUSL_CROSS_ROOT: ${{ runner.temp }}/musl-cross
        run: scripts/build-musl.sh "${{ matrix.arch_label }}" "${{ runner.temp }}/binary-out"

      - name: Save musl-cross toolchain
        if: github.ref == 'refs/heads/master' && steps.musl-cross-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/musl-cross
          key: musl-cross-${{ env.MUSL_CROSS_VERSION }}-${{ matrix.arch_label }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: binaries=${{ runner.temp }}/binary-out
          platforms: ${{ matrix.platform }}
          target: runtime
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Prepare binary artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/release"
          cp "${{ runner.temp }}/binary-out/h3llo" \
             "${{ runner.temp }}/release/h3llo-linux-${{ matrix.arch_label }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: binary-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/release/h3llo-linux-${{ matrix.arch_label }}
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch digests into a single multi-arch manifest list on Docker Hub.
  # Gates behind ALL jobs: builds must succeed AND tests must pass.
  docker-merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker-build, linux, docker-tests]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Create a GitHub release when a version tag is pushed or master is updated.
  # Gates behind docker-merge, which transitively requires all builds and tests.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker-merge]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/binaries
          pattern: binary-*
          merge-multiple: true

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/binaries/h3llo-linux-*

      - name: Publish dev release
        if: github.ref == 'refs/heads/master'
        run: |
          ls ${{ runner.temp }}/binaries/h3llo-linux-* || { echo "::error::No binary artifacts found"; exit 1; }
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            ${{ runner.temp }}/binaries/h3llo-linux-* \
            --prerelease \
            --title "Development Build ($(date -u +%Y-%m-%d))" \
            --generate-notes \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
