name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
      - name: Cargo test
        run: cargo test --lib

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: h3llo:test
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build container test binaries
        run: |
          cross test --test integration-container-tun --target x86_64-unknown-linux-musl --no-run
          cross test --test integration-container-route --target x86_64-unknown-linux-musl --no-run
      - name: Run integration tests
        run: cargo test --test integration -- --ignored --nocapture
      - name: Run E2E tests
        run: cargo test --test e2e -- --ignored --nocapture
