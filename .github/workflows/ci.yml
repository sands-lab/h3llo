name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
      - name: Cargo test
        run: cargo test --lib

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: h3llo:test
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain and dependencies
        run: |
          # Download prebuilt musl toolchain from musl.cc (includes g++ for C++ support)
          curl -sSfL https://musl.cc/x86_64-linux-musl-cross.tgz | sudo tar -xzf - -C /opt
          echo "/opt/x86_64-linux-musl-cross/bin" >> $GITHUB_PATH
          # Install boring-sys build dependencies
          sudo apt-get update
          sudo apt-get install -y cmake perl golang-go clang
      - name: Build container test binaries
        run: |
          cargo test --test integration-container-tun --target x86_64-unknown-linux-musl --no-run
          cargo test --test integration-container-route --target x86_64-unknown-linux-musl --no-run
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CXX_x86_64_unknown_linux_musl: x86_64-linux-musl-g++
          AR_x86_64_unknown_linux_musl: x86_64-linux-musl-ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc
      - name: Run integration tests
        run: cargo test --test integration -- --ignored --nocapture
      - name: Run E2E tests
        run: cargo test --test e2e -- --ignored --nocapture
