name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: llvm-tools-preview
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy --target x86_64-unknown-linux-musl -- -D warnings
      - name: Generate coverage
        run: cargo llvm-cov --target x86_64-unknown-linux-musl --lib --codecov --output-path codecov.json
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: h3llo:test
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build container test binaries
        run: |
          cargo test --test integration-container-tun --target x86_64-unknown-linux-musl --no-run
          cargo test --test integration-container-route --target x86_64-unknown-linux-musl --no-run
      - name: Run integration tests
        run: cargo test --test integration -- --ignored --nocapture
      - name: Run E2E tests
        run: cargo test --test e2e -- --ignored --nocapture
