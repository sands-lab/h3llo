name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: nekonuts/h3llo
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  linux:
    # Change this anchor to `self-hosted` to move every job back to the local runner.
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Rust directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Generate coverage
        run: cargo llvm-cov --lib --codecov --output-path codecov.json
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-tests:
    runs-on: *runner
    timeout-minutes: 30
    concurrency:
      group: docker-tests
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Rust directories
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ci-builder
          keep-state: true
      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          tags: h3llo:test
          target: test
          platforms: linux/amd64
          load: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run integration tests
        run: cargo test --test integration --features test-utils -- --ignored --nocapture
      - name: Run E2E tests
        run: cargo test --test e2e -- --ignored --nocapture

  # Build multi-arch Docker images in parallel with lint and test jobs.
  # Runs on PRs too (for cross-compilation validation) but skips push.
  docker-build:
    runs-on: *runner
    timeout-minutes: 60
    concurrency:
      group: buildx-${{ matrix.arch_label }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_label: amd64
          - platform: linux/arm64
            arch_label: arm64
          - platform: linux/riscv64
            arch_label: riscv64
    steps:
      - name: Isolate Docker config per arch
        run: |
          mkdir -p "$HOME/.docker-${{ matrix.arch_label }}"
          echo "DOCKER_CONFIG=$HOME/.docker-${{ matrix.arch_label }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: builder-${{ matrix.arch_label }}
          keep-state: true

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ matrix.platform }}
          target: runtime
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Export binary
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ matrix.platform }}
          target: export
          outputs: type=local,dest=${{ runner.temp }}/binary-out

      - name: Rename binary artifact
        if: github.event_name != 'pull_request'
        run: |
          mv "${{ runner.temp }}/binary-out/h3llo" \
             "${{ runner.temp }}/binary-out/h3llo-linux-${{ matrix.arch_label }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: binary-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/binary-out/h3llo-linux-${{ matrix.arch_label }}
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch digests into a single multi-arch manifest list on Docker Hub.
  # Gates behind ALL jobs: builds must succeed AND tests must pass.
  docker-merge:
    if: github.event_name != 'pull_request'
    runs-on: *runner
    timeout-minutes: 10
    needs: [docker-build, linux, docker-tests]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Create a GitHub release when a version tag is pushed or master is updated.
  # Gates behind docker-merge, which transitively requires all builds and tests.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: *runner
    timeout-minutes: 10
    needs: [docker-merge]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/binaries
          pattern: binary-*
          merge-multiple: true

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/binaries/h3llo-linux-*

      - name: Publish dev release
        if: github.ref == 'refs/heads/master'
        run: |
          ls ${{ runner.temp }}/binaries/h3llo-linux-* || { echo "::error::No binary artifacts found"; exit 1; }
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            ${{ runner.temp }}/binaries/h3llo-linux-* \
            --prerelease \
            --title "Development Build ($(date -u +%Y-%m-%d))" \
            --generate-notes \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
