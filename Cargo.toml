[package]
name = "h3llo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.48", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros"] }

[[bin]]
name = "h3llo"
path = "src/main.rs"
