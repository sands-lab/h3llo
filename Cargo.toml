[package]
name = "h3llo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
socket2 = "0.6"
hickory-proto = { version = "0.25", default-features = false }
rand = "0.9"
url = "2"
libc = "0.2"
ipnet = "2"
log = "0.4"
tun-rs = { version = "2", features = ["async"] }
ipnet-trie = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
net-route = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }

[[bin]]
name = "h3llo"
path = "src/main.rs"
