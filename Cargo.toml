[package]
name = "h3llo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
# Exposes internal test utilities (MemoryTun) for integration tests
test-utils = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
socket2 = "0.6"
quinn-udp = "0.5"
hickory-proto = { version = "0.25", default-features = false }
url = "2"
libc = "0.2"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2", features = ["async"] }
ipnet-trie = "0.3"
tokio-quiche = "0.15"
futures-util = "0.3"
prometheus-client = "0.24"
foundations = { version = "5", default-features = false, features = ["metrics", "logging", "tracing-rs-compat"] }
rustls-pemfile = "2"
http = "1"
bytes = "1"
subtle = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rand = "0.10"

# Use mimalloc for musl targets to avoid musl's slow default allocator.
# Purge tuning is done via MIMALLOC_PURGE_DELAY=0 env var in the Dockerfile.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", features = ["debug", "override"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "process"] }
hyper = { version = "1", features = ["client"] }
testcontainers = "0.27"
tempfile = "3"
tracing-test = "0.2"
rand = "0.10"
rcgen = "0.14"
serde_json = "1"
tokio-util = "0.7"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
route_manager = { version = "0.2.9", features = ["async"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }

[[bin]]
name = "h3llo"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["test-utils"]

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "integration-container-tun"
path = "tests/integration/container/tun.rs"
harness = false

[[test]]
name = "integration-container-route"
path = "tests/integration/container/route.rs"
harness = false

# Patch quiche monorepo for:
# - datagram-socket: musl compatibility (msghdr private padding fields)
#   See: https://github.com/rust-lang/libc/issues/2344
# - quiche: "none" congestion control algorithm
# - tokio-quiche: must match patched quiche API
[patch.crates-io]
datagram-socket = { git = "https://github.com/Tonny-Gu/quiche" }
quiche = { git = "https://github.com/Tonny-Gu/quiche" }
tokio-quiche = { git = "https://github.com/Tonny-Gu/quiche" }
