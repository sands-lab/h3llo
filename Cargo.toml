[package]
name = "h3llo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
# Exposes internal test utilities (MemoryTun) for integration tests
test-utils = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "signal"] }
socket2 = "0.6"
hickory-proto = { version = "0.25", default-features = false }
rand = "0.9"
url = "2"
libc = "0.2"
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2", features = ["async"] }
ipnet-trie = "0.3"

# HTTP/3 and QUIC (Steps 8-9 of docs/plan.md)
quinn = "0.11"
# Use git version for connect-ip support (RFC 9484), pending crates.io release
h3 = { git = "https://github.com/hyperium/h3", branch = "master" }
h3-quinn = { git = "https://github.com/hyperium/h3", branch = "master" }
h3-datagram = { git = "https://github.com/hyperium/h3", branch = "master" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
base64 = "0.22"
http = "1"
bytes = "1"
subtle = "2"

# Use mimalloc for musl targets to avoid musl's slow default allocator
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "process"] }
testcontainers = "0.23"
tempfile = "3"
tracing-test = "0.2"
rcgen = "0.13"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
route_manager = { version = "0.2.9", features = ["async"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }

[[bin]]
name = "h3llo"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "integration-container-tun"
path = "tests/integration/container/tun.rs"
harness = false

[[test]]
name = "integration-container-route"
path = "tests/integration/container/route.rs"
harness = false

